<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주차층알리미 자동차 투명도 미리보기</title>
  <style>
    :root {
      --detecting-alpha: 1;
      --completed-alpha: 1;
      --outside-alpha: 1;
      --pulse-y: 66%;
      --purple: #7a5cff;
      --deep: #1a1033;
      --muted: #6b7280;
      --yellow: #ffd54f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #faf9fe;
      color: var(--deep);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--purple);
      font-size: 28px;
      letter-spacing: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .control {
      background: #fff;
      border: 1px solid #ede9ff;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 18px rgba(46, 31, 112, .08);
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--purple);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 272px;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(135deg, #8b6cff 0%, #6f4eff 45%, #4e35c9 100%);
      box-shadow: 0 20px 36px rgba(91, 63, 214, .22);
    }

    .card.outside {
      background:
        linear-gradient(90deg, rgba(78, 53, 201, .90), rgba(78, 53, 201, .2)),
        url("app/src/main/res/drawable/outside_background.png") center / cover;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 64%;
      padding: 36px 24px;
      color: #fff;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      opacity: .86;
      margin-bottom: 28px;
    }

    .small {
      font-size: 14px;
      font-weight: 700;
      opacity: .9;
      margin-bottom: 8px;
    }

    .title {
      font-size: 30px;
      line-height: 1.14;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
    }

    .pill b { color: var(--yellow); }

    .car {
      position: absolute;
      z-index: 1;
      right: 14px;
      bottom: 20px;
      width: 46%;
      max-width: 190px;
      pointer-events: none;
    }

    .pulse {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: var(--pulse-y);
      width: 43%;
      aspect-ratio: 3.2 / 1;
      border: 2px solid rgba(255,255,255,.26);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .pulse.p1 {
      width: 18%;
      opacity: .62;
    }

    .pulse.p2 {
      width: 28%;
      opacity: .46;
    }

    .pulse.p3 {
      width: 38%;
      opacity: .32;
    }

    .pulse.p4 {
      width: 48%;
      opacity: .22;
    }

    .detecting .car {
      opacity: var(--detecting-alpha);
      right: 6px;
      bottom: 48px;
    }

    .completed .car {
      opacity: var(--completed-alpha);
    }

    .outside .car {
      opacity: var(--outside-alpha);
      width: 40%;
      bottom: 20px;
    }

    .pin {
      position: absolute;
      z-index: 3;
      right: 78px;
      top: 72px;
      width: 64px;
      height: 76px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.12));
    }

    @media (max-width: 900px) {
      .controls,
      .grid {
        grid-template-columns: 1fr;
      }

      .content {
        width: 68%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>자동차 투명도 미리보기</h1>

    <section class="controls">
      <div class="control">
        <label for="detecting">감지 중 <span id="detectingValue">1.00</span></label>
        <input id="detecting" type="range" min="0" max="1" step="0.05" value="1.00" />
      </div>
      <div class="control">
        <label for="completed">주차 완료 <span id="completedValue">1.00</span></label>
        <input id="completed" type="range" min="0" max="1" step="0.05" value="1.00" />
      </div>
      <div class="control">
        <label for="outside">집 밖 <span id="outsideValue">1.00</span></label>
        <input id="outside" type="range" min="0" max="1" step="0.05" value="1.00" />
      </div>
      <div class="control">
        <label for="pulseY">파장 위아래 위치 <span id="pulseYValue">66%</span></label>
        <input id="pulseY" type="range" min="55" max="90" step="1" value="66" />
      </div>
    </section>

    <section class="grid">
      <article class="card detecting">
        <div class="content">
          <div class="label">현재 위치 감지</div>
          <div class="title">주차 감지 중</div>
          <div class="pill">추정 층수 : <b>지하 2층</b></div>
        </div>
        <div class="pulse p1"></div>
        <div class="pulse p2"></div>
        <div class="pulse p3"></div>
        <div class="pulse p4"></div>
        <img class="car" src="app/src/main/res/drawable/car_front.png" alt="" />
      </article>

      <article class="card completed">
        <div class="content">
          <div class="label">현재 위치 감지</div>
          <div class="small">주차가 완료됐어요</div>
          <div class="title">지하 2층에<br />주차했어요</div>
          <div class="pill">기록 완료 : <b>지하 2층</b></div>
        </div>
        <svg class="pin" viewBox="0 0 64 76" aria-hidden="true">
          <path fill="#fff" d="M32 0C14.33 0 0 14.1 0 31.48c0 22.2 32 44.52 32 44.52s32-22.32 32-44.52C64 14.1 49.67 0 32 0Z"/>
          <text x="32" y="42" text-anchor="middle" font-size="30" font-weight="900" fill="#7a5cff">P</text>
        </svg>
        <img class="car" src="app/src/main/res/drawable/car_front.png" alt="" />
      </article>

      <article class="card outside">
        <div class="content">
          <div class="label">현재 위치 감지</div>
          <div class="small">우리집 근처를 벗어났어요</div>
          <div class="title">감지를<br />종료했어요</div>
          <div class="pill">현재는 <b>우리집 주차장 밖</b>이에요</div>
        </div>
        <img class="car" src="app/src/main/res/drawable/car_front.png" alt="" />
      </article>
    </section>
  </main>

  <script>
    const bind = (id, variable) => {
      const input = document.getElementById(id);
      const value = document.getElementById(`${id}Value`);
      const update = () => {
        document.documentElement.style.setProperty(variable, input.value);
        value.textContent = Number(input.value).toFixed(2);
      };
      input.addEventListener("input", update);
      update();
    };

    bind("detecting", "--detecting-alpha");
    bind("completed", "--completed-alpha");
    bind("outside", "--outside-alpha");

    const pulseY = document.getElementById("pulseY");
    const pulseYValue = document.getElementById("pulseYValue");
    const updatePulseY = () => {
      document.documentElement.style.setProperty("--pulse-y", `${pulseY.value}%`);
      pulseYValue.textContent = `${pulseY.value}%`;
    };
    pulseY.addEventListener("input", updatePulseY);
    updatePulseY();
  </script>
</body>
</html>
